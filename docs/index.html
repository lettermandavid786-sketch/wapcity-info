<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>wapForum на WapCity</title>
<meta name="description" content="Восстановленный по веб-архивам WAP-форум forum.wapcity.ru: разделы, темы, сообщения, люди и история.">
<style>
:root {
  color-scheme: light;
  --bg: #f4f3ef;
  --surface: #fcfcfb;
  --surface-2: #efeee9;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --ink-3: #85847e;
  --line: #dddcd5;
  --accent: #2a78d6;
  --accent-ink: #ffffff;
  --accent-soft: #e3eefb;
  --bar: #2a78d6;
  --bar-hover: #1b5aa6;
  --warm: #eb6834;
  --phone: #2b2b29;
  --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.05);
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121211; --surface: #1a1a19; --surface-2: #232321; --ink: #ffffff; --ink-2: #c3c2b7; --ink-3: #8e8d85;
    --line: #34332f; --accent: #3987e5; --accent-ink: #ffffff; --accent-soft: #1d2b3d; --bar: #3987e5; --bar-hover: #77aef0;
    --warm: #d95926; --phone: #050505; --shadow: 0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121211; --surface: #1a1a19; --surface-2: #232321; --ink: #ffffff; --ink-2: #c3c2b7; --ink-3: #8e8d85;
  --line: #34332f; --accent: #3987e5; --accent-ink: #ffffff; --accent-soft: #1d2b3d; --bar: #3987e5; --bar-hover: #77aef0;
  --warm: #d95926; --phone: #050505; --shadow: 0 1px 2px rgba(0,0,0,.4);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--sans); }
a { color: var(--accent); }
button, input, select { font: inherit; color: inherit; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.mono { font-family: var(--mono); }

header.top { display: flex; align-items: center; gap: 14px; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; }
.logo { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font: 700 13px var(--mono); letter-spacing: -.04em; }
.brand b { font-size: 16px; letter-spacing: -.01em; }
.brand small { display: block; font-size: 11.5px; color: var(--ink-3); line-height: 1.1; }
nav.tabs { display: flex; gap: 2px; flex-wrap: wrap; }
nav.tabs a { padding: 6px 12px; border-radius: 8px; text-decoration: none; color: var(--ink-2); white-space: nowrap; }
nav.tabs a:hover { background: var(--surface-2); color: var(--ink); }
nav.tabs a.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.spacer { flex: 1; }
.icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 5px 9px; cursor: pointer; line-height: 1; display: inline-flex; align-items: center; justify-content: center; min-height: 32px; gap: 6px; text-decoration: none; color: var(--ink); }
.icon-btn:hover { background: var(--surface-2); }
.qsearch { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 6px 10px; width: 220px; }

main { max-width: 1120px; margin: 0 auto; padding: 22px 16px 60px; }
.crumbs { font-size: 13px; color: var(--ink-3); margin: 0 0 6px; }
.crumbs a { color: var(--ink-2); text-decoration: none; }
.crumbs a:hover { text-decoration: underline; }
h1 { font-size: 30px; line-height: 1.15; margin: 2px 0 8px; letter-spacing: -.02em; }
h2 { font-size: 19px; margin: 34px 0 12px; letter-spacing: -.01em; }
h3 { font-size: 15px; margin: 0 0 4px; }
.lede { color: var(--ink-2); max-width: 760px; margin: 0 0 18px; font-size: 16px; }
.grid { display: grid; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; box-shadow: var(--shadow); }
.kpis { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.kpi .v { font-size: 26px; font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.kpi .l { color: var(--ink-2); font-size: 13px; }
.two { grid-template-columns: 1.3fr 1fr; }
.cols3 { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
@media (max-width: 860px) { .two { grid-template-columns: 1fr; } }
.badge { display: inline-block; font-size: 11.5px; padding: 0 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); white-space: nowrap; }
.badge.acc { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.note { border-left: 3px solid var(--accent); background: var(--surface); padding: 10px 14px; border-radius: 0 8px 8px 0; margin: 12px 0; color: var(--ink-2); }
.hero { display: grid; grid-template-columns: 1fr 260px; gap: 28px; align-items: center; margin-bottom: 8px; }
@media (max-width: 760px) { .hero { grid-template-columns: 1fr; } .hero .phone-mini { display: none; } }
.eyebrow { font: 600 12px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }

/* timeline */
.tl { list-style: none; margin: 0; padding: 0 0 0 18px; border-left: 2px solid var(--line); }
.tl li { position: relative; padding: 0 0 18px 14px; }
.tl li::before { content: ""; position: absolute; left: -25px; top: 6px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); }
.tl .d { font: 600 12.5px var(--mono); color: var(--accent); }
.tl .t { font-weight: 600; }
.tl .x { color: var(--ink-2); font-size: 14px; }

/* lists */
.rows { list-style: none; margin: 0; padding: 0; }
.rows > li { border-bottom: 1px solid var(--line); }
.rows > li:last-child { border-bottom: 0; }
.rows a.r { display: grid; grid-template-columns: 1fr auto; gap: 4px 14px; padding: 10px 12px; text-decoration: none; color: inherit; border-radius: 8px; align-items: center; }
.rows a.r:hover { background: var(--surface-2); }
.r .tt { font-weight: 600; overflow-wrap: anywhere; }
.r .sub { grid-column: 1; font-size: 12.5px; color: var(--ink-3); display: flex; gap: 10px; flex-wrap: wrap; }
.r .num { grid-row: 1 / span 2; grid-column: 2; text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); font-size: 13px; line-height: 1.3; }
.r .num b { display: block; color: var(--ink); font-size: 16px; }
.group-h { display: flex; align-items: baseline; gap: 10px; margin: 26px 0 8px; flex-wrap: wrap; }
.group-h h2 { margin: 0; }

/* thread */
.post { display: grid; grid-template-columns: 44px 1fr; gap: 10px; padding: 14px 4px; border-bottom: 1px solid var(--line); }
.post:last-child { border-bottom: 0; }
.ava { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #fff; font-size: 15px; }
.ava.big { width: 56px; height: 56px; font-size: 22px; }
.post .h { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.post .h a.nick { font-weight: 650; text-decoration: none; color: var(--ink); }
.post .h a.nick:hover { text-decoration: underline; }
.post .when { font-size: 12.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.post .src { font-size: 12px; color: var(--ink-3); margin-left: auto; text-decoration: none; }
.post .src:hover { color: var(--accent); }
.post .body { white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 2px; }
.gap-note { text-align: center; font-size: 12.5px; color: var(--ink-3); padding: 8px; border-bottom: 1px dashed var(--line); }
.toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 0 0 12px; }
.toolbar input[type=search], .toolbar select { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 10px; }
.toolbar input[type=search] { flex: 1; min-width: 200px; }
mark { background: #ffe58a; color: #111; border-radius: 2px; }
.pager { display: flex; gap: 8px; align-items: center; justify-content: center; margin: 16px 0; }

/* people */
table.data { width: 100%; border-collapse: collapse; font-size: 14px; }
table.data th { text-align: left; font-weight: 600; color: var(--ink-2); border-bottom: 1px solid var(--line); padding: 8px; cursor: pointer; user-select: none; white-space: nowrap; }
table.data th.sorted::after { content: " ↓"; }
table.data td { border-bottom: 1px solid var(--line); padding: 8px; vertical-align: middle; }
table.data td.num, table.data th.num { text-align: right; font-variant-numeric: tabular-nums; }
.who { display: flex; gap: 10px; align-items: center; }
.who .ava { width: 30px; height: 30px; font-size: 12px; }
.tbl-wrap { overflow-x: auto; }

/* charts */
.chart { position: relative; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart .ax text { fill: var(--ink-3); font-size: 11px; }
.chart .gl { stroke: var(--line); stroke-width: 1; }
.chart .ln { fill: none; stroke: var(--bar); stroke-width: 2; }
.chart .dot { fill: var(--bar); stroke: var(--surface); stroke-width: 2; }
.chart .bar { fill: var(--bar); }
.chart .lbl { fill: var(--ink-2); font-size: 11.5px; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); padding: 6px 9px; border-radius: 6px; font-size: 12px; white-space: nowrap; transform: translate(-50%, -100%); margin-top: -10px; display: none; z-index: 3; }
.hbars { display: grid; gap: 6px; }
.hbar { display: grid; grid-template-columns: 150px 1fr 64px; align-items: center; gap: 8px; font-size: 14px; }
.hbar .track { height: 10px; border-radius: 0 4px 4px 0; background: var(--bar); min-width: 2px; }
.hbar .n { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); }

/* gallery */
.gal { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 18px; }
.shot { text-decoration: none; color: inherit; }
.device { background: var(--phone); border-radius: 22px; padding: 26px 9px 32px; box-shadow: var(--shadow); }
.device .scr { background: var(--surface); height: 300px; overflow: hidden; border-radius: 3px; position: relative; }
.device iframe { border: 0; width: 240px; height: 300px; display: block; pointer-events: none; }
.shot .cap { margin-top: 8px; font-size: 13.5px; }
.shot .cap b { display: block; }
.shot:hover .device { outline: 2px solid var(--accent); outline-offset: 3px; }
.phone-mini .device .scr { height: 330px; }
.phone-mini iframe { height: 330px; }

.text-block { white-space: pre-wrap; }
footer { max-width: 1120px; margin: 0 auto; padding: 0 16px 40px; color: var(--ink-3); font-size: 13px; }
@media (max-width: 760px) {
  header.top { gap: 8px; padding: 8px 12px; }
  nav.tabs { order: 3; width: 100%; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  #qform { display: none; }
  h1 { font-size: 24px; }
  .hbar { grid-template-columns: 110px 1fr 54px; }
  .hide-sm { display: none; }
}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#/"><span class="logo">wF</span><span><b>wapForum</b><small>forum.wapcity.ru · 2006–2017</small></span></a>
  <nav class="tabs" id="tabs">
    <a href="#/" data-t="home">О форуме</a>
    <a href="#/forum" data-t="forum">Форум</a>
    <a href="#/people" data-t="people">Люди</a>
    <a href="#/search" data-t="search">Поиск</a>
    <a href="#/gallery" data-t="gallery">Как это выглядело</a>
    <a href="archive.html" title="Все сохранённые страницы как есть">Исходные страницы ↗</a>
  </nav>
  <span class="spacer"></span>
  <form id="qform" role="search"><input class="qsearch" id="qtop" type="search" placeholder="Поиск по сообщениям" aria-label="Поиск по сообщениям"></form>
  <button class="icon-btn" id="themeBtn" title="Сменить тему" aria-label="Сменить тему"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg></button>
</header>
<main id="app"></main>
<footer id="foot"></footer>

<script src="forum.js"></script>
<script>
(function () {
"use strict";
var D = window.WC_FORUM || { hosts: {}, forums: [], topics: [], posts: [], users: [], news: [], info: [], extras: [], sections: [], growth: [], gallery: [], capturesPerYear: [], cdxHosts: {} };
var app = document.getElementById("app");
var MON = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];
var MON_S = ["янв", "фев", "мар", "апр", "май", "июн", "июл", "авг", "сен", "окт", "ноя", "дек"];
var HOSTS = {
  "forum.wapcity.ru": "WapCity",
  "mts.forum.wapcity.ru": "МТС",
  "djuce.forum.wapcity.ru": "djuice (Киевстар)",
  "ncc.forum.wapcity.ru": "НСС",
  "on.forum.wapcity.ru": "on16.ru"
};

/* ---------- helpers */
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function num(n) { return Number(n || 0).toLocaleString("ru-RU"); }
function plural(n, a, b, c) { n = Math.abs(n) % 100; var m = n % 10; return n > 10 && n < 20 ? c : m > 1 && m < 5 ? b : m === 1 ? a : c; }
function tsDate(ts) { return ts ? ts.slice(6, 8) + "." + ts.slice(4, 6) + "." + ts.slice(0, 4) : "—"; }
function tsLong(ts) { return ts ? (+ts.slice(6, 8)) + " " + MON[+ts.slice(4, 6) - 1] + " " + ts.slice(0, 4) : "—"; }
function tsMonth(ts) { return ts ? MON_S[+ts.slice(4, 6) - 1] + " " + ts.slice(0, 4) : "—"; }
function at2ts(at) { return at ? at.replace(/[-: ]/g, "") : ""; }
function atShow(at) { if (!at) return "дата не сохранилась"; return at.slice(8, 10) + "." + at.slice(5, 7) + "." + at.slice(0, 4) + " " + at.slice(11, 16); }
function hostName(h) { return HOSTS[h] || h; }
function srcLink(id) { return "archive.html#/view/" + id; }
var AVA = ["#2a78d6", "#eb6834", "#1baf7a", "#c98500", "#d55181", "#008300", "#4a3aa7", "#e34948"];
function ava(nick, cls) {
  var h = 0; for (var i = 0; i < (nick || "").length; i++) h = (h * 31 + nick.charCodeAt(i)) >>> 0;
  var ch = (nick || "?").replace(/[^0-9A-Za-zА-Яа-яЁёІіЇїЄє]/g, "").charAt(0) || "?";
  return '<span class="ava' + (cls ? " " + cls : "") + '" style="background:' + AVA[h % AVA.length] + '" aria-hidden="true">' + esc(ch.toUpperCase()) + "</span>";
}
function save(k, v) { try { localStorage.setItem("wf." + k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem("wf." + k); } catch (e) { return null; } }

/* ---------- indexes */
D.topics.forEach(function (t, i) { t.i = i; t.posts = []; });
D.posts.forEach(function (p, i) { p.i = i; var t = D.topics[p.k]; if (t) t.posts.push(p); });
D.topics.forEach(function (t) {
  t.posts.sort(function (a, b) { return (a.at || "") < (b.at || "") ? -1 : (a.at || "") > (b.at || "") ? 1 : 0; });
  t.found = t.posts.length;
  var last = t.posts.length ? t.posts[t.posts.length - 1].at : null;
  t.act = [t.lastAt, last].filter(Boolean).sort().pop() || null;
});
var forumKey = function (h, o, f) { return h + "|" + (o ? 1 : 0) + "|" + f; };
var FORUMS = {};
D.forums.forEach(function (f) { f.key = forumKey(f.h, f.o, f.f); f.list = []; f.found = 0; FORUMS[f.key] = f; });
D.topics.forEach(function (t) {
  var k = forumKey(t.h, t.o, t.f);
  if (!FORUMS[k]) { FORUMS[k] = { h: t.h, o: t.o, f: t.f, name: "Форум " + t.f, topics: 0, key: k, list: [], found: 0, mods: [] }; D.forums.push(FORUMS[k]); }
  FORUMS[k].list.push(t); FORUMS[k].found += t.found;
});
D.forums.forEach(function (f) {
  f.act = f.list.map(function (t) { return t.act; }).filter(Boolean).sort().pop() || null;
  f.declared = f.list.reduce(function (s, t) { return s + (t.count || 0); }, 0);
});
var USERS = {};
D.users.forEach(function (u) { u.key = u.h + "|" + u.id; USERS[u.key] = u; u.list = []; });
D.posts.forEach(function (p) { var t = D.topics[p.k]; var u = USERS[t.h + "|" + p.u]; if (u) u.list.push(p); });
var allPostsDated = D.posts.filter(function (p) { return p.at; }).map(function (p) { return p.at; }).sort();

/* ---------- theme */
var theme = load("theme");
function applyTheme() { if (theme) document.documentElement.setAttribute("data-theme", theme); else document.documentElement.removeAttribute("data-theme"); }
applyTheme();
$("themeBtn").onclick = function () {
  var dark = theme ? theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  theme = dark ? "light" : "dark"; save("theme", theme); applyTheme();
  document.querySelectorAll("iframe").forEach(function (f) { try { f.contentWindow.postMessage({ wc: "theme", theme: theme }, "*"); } catch (e) {} });
};
window.addEventListener("message", function (ev) {
  if (ev.data && ev.data.wc === "nav" && theme) try { ev.source.postMessage({ wc: "theme", theme: theme }, "*"); } catch (e) {}
});

/* ---------- router */
function route() {
  var h = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
  var q = "";
  var qi = h.indexOf("?"); if (qi >= 0) { q = h.slice(qi + 1); h = h.slice(0, qi); }
  var parts = h.split("/");
  var tab = parts[0] || "home";
  var tabMap = { "": "home", home: "home", forum: "forum", f: "forum", topic: "forum", people: "people", user: "people", search: "search", gallery: "gallery" };
  document.querySelectorAll("#tabs a").forEach(function (a) { a.classList.toggle("on", a.dataset.t === tabMap[tab]); });
  if (tab === "f") viewForum(parts[1]);
  else if (tab === "topic") viewTopic(+parts[1]);
  else if (tab === "forum") viewForums();
  else if (tab === "people") viewPeople();
  else if (tab === "user") viewUser(parts[1] + "|" + parts[2]);
  else if (tab === "search") viewSearch(new URLSearchParams(q).get("q") || "");
  else if (tab === "gallery") viewGallery();
  else viewHome();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
$("qform").onsubmit = function (e) { e.preventDefault(); location.hash = "#/search?q=" + encodeURIComponent($("qtop").value.trim()); };

/* ---------- home */
function facts() {
  var hosts = Object.keys(D.hosts);
  var cdx = D.cdxHosts || {};
  var first = null, last = null;
  Object.keys(cdx).forEach(function (h) { if (!first || cdx[h].first < first) first = cdx[h].first; if (!last || cdx[h].last > last) last = cdx[h].last; });
  return { hosts: hosts, first: first, last: last };
}
function timeline() {
  var ev = [];
  var lic = D.info.filter(function (i) { return /Мобидо/.test(i.text + i.title); })[0];
  if (lic) ev.push({ d: "2005", t: "Сервис wapForum", x: "Мобильный форум разработан компанией «Мобитех» (торговая марка «Мобидо.ру»). В подвале всех страниц: © «Мобидо.ру» 2005.", src: lic.src });
  var cdx = D.cdxHosts || {};
  var hs = Object.keys(D.hosts).sort(function (a, b) { return (D.hosts[a].first || "") < (D.hosts[b].first || "") ? -1 : 1; });
  hs.forEach(function (h) {
    var H = D.hosts[h], c = cdx[h] || {};
    var f = c.first && c.first < (H.first || "9") ? c.first : H.first;
    ev.push({ ts: f, t: h, x: "Первый снимок в веб-архиве" + (H.operators && H.operators.length ? ". Площадка для абонентов: " + H.operators.join(", ") : "") + "." });
  });
  var g = D.growth.filter(function (x) { return x.kind === "aid"; });
  if (g.length > 1) {
    var a = g[0], b = g[g.length - 1];
    ev.push({ ts: b.ts, t: "≈" + num(b.max - a.max) + " новых анкет", x: "Номер последней зарегистрированной анкеты вырос с " + num(a.max) + " (" + tsMonth(a.ts) + ") до " + num(b.max) + " (" + tsMonth(b.ts) + "). Счётчик общий для всех площадок — одна база на всех операторов." });
  }
  var main = D.hosts["forum.wapcity.ru"];
  if (main && main.engineFirst && main.engineFirst["new"]) {

function fillPeople() {
  var q = pq.toLowerCase();
  var rows = D.users.filter(function (u) { return !q || u.nick.toLowerCase().indexOf(q) >= 0 || u.aka.join(" ").toLowerCase().indexOf(q) >= 0; });
  var cmp = {
    nick: function (a, b) { return a.nick.localeCompare(b.nick, "ru"); },
    h: function (a, b) { return a.h < b.h ? -1 : 1; },
    posts: function (a, b) { return b.posts - a.posts || (b.msgs || 0) - (a.msgs || 0); },
    msgs: function (a, b) { return (b.msgs || 0) - (a.msgs || 0); },
    reg: function (a, b) { return (a.reg || "9") < (b.reg || "9") ? -1 : 1; },
    last: function (a, b) { return (lastAt(b) || "") < (lastAt(a) || "") ? -1 : 1; }
  }[psort];
  rows.sort(cmp);
  var per = 100, pages = Math.max(1, Math.ceil(rows.length / per));
  $("ptb").innerHTML = rows.slice(ppage * per, (ppage + 1) * per).map(function (u) {
    var l = lastAt(u);
    return '<tr><td><a class="who" href="#/user/' + encodeURIComponent(u.h) + "/" + u.id + '" style="text-decoration:none;color:inherit">' + ava(u.nick) + "<span><b>" + esc(u.nick) + "</b>" + (u.status ? ' <span class="faint" style="font-size:12px">' + esc(u.status) + "</span>" : "") + '</span></a></td><td class="hide-sm">' + esc(hostName(u.h)) + '</td><td class="num">' + num(u.posts) + '</td><td class="num hide-sm">' + (u.msgs != null ? num(u.msgs) : "—") + '</td><td class="hide-sm">' + (u.reg ? atShow(u.reg).slice(0, 10) : "—") + "</td><td>" + (l ? atShow(l).slice(0, 10) : "—") + "</td></tr>";
  }).join("") || '<tr><td colspan="6" class="faint">никого не найдено</td></tr>';
  $("ppg").innerHTML = pages > 1 ? '<button class="icon-btn" id="pp"' + (ppage ? "" : " disabled") + '>←</button><span class="muted">' + (ppage + 1) + " / " + pages + " · " + num(rows.length) + ' участников</span><button class="icon-btn" id="pn"' + (ppage < pages - 1 ? "" : " disabled") + ">→</button>" : '<span class="muted">' + num(rows.length) + " " + plural(rows.length, "участник", "участника", "участников") + "</span>";
  if ($("pp")) { $("pp").onclick = function () { ppage--; fillPeople(); }; $("pn").onclick = function () { ppage++; fillPeople(); }; }
}
function viewUser(key) {
  var u = USERS[key];
  if (!u) { app.innerHTML = '<div class="note">Участник не найден. <a href="#/people">Ко всем участникам</a></div>'; return; }
  var posts = u.list.slice().sort(function (a, b) { return (b.at || "") < (a.at || "") ? -1 : 1; });
  var byTopic = {};
  posts.forEach(function (p) { byTopic[p.k] = (byTopic[p.k] || 0) + 1; });
  var tks = Object.keys(byTopic).sort(function (a, b) { return byTopic[b] - byTopic[a]; });
  var facts = [];
  if (u.status) facts.push(["Статус", u.status]);
  if (u.msgs != null) facts.push(["Сообщений по анкете", num(u.msgs)]);
  facts.push(["Найдено сообщений", num(u.posts)]);
  if (u.reg) facts.push(["Регистрация", atShow(u.reg)]);
  if (u.seen) facts.push(["Последний вход", atShow(u.seen)]);
  if (u.gender) facts.push(["Пол", u.gender]);
  if (u.aka.length) facts.push(["Другие ники", u.aka.join(", ")]);
  facts.push(["Площадка", hostName(u.h)]);
  var html = '<div class="crumbs"><a href="#/people">Люди</a></div><div style="display:flex;gap:14px;align-items:center;margin:4px 0 14px">' + ava(u.nick, "big") + "<h1 style='margin:0'>" + esc(u.nick) + "</h1></div>" +
    '<div class="grid two"><div><div class="card"><table class="data">' + facts.map(function (f) { return '<tr><td class="muted" style="width:45%">' + esc(f[0]) + "</td><td>" + esc(f[1]) + "</td></tr>"; }).join("") + "</table></div></div>" +
    "<div><div class='card' style='padding:4px'><ul class='rows'>" + (tks.slice(0, 8).map(function (k) { var t = D.topics[k]; return '<li><a class="r" href="#/topic/' + k + '"><span class="tt">' + esc(t.title) + '</span><span class="sub">' + esc(FORUMS[forumKey(t.h, t.o, t.f)].name) + '</span><span class="num"><b>' + byTopic[k] + "</b>сообщ.</span></a></li>"; }).join("") || '<li class="faint" style="padding:12px">сообщения не сохранились</li>') + "</ul></div></div></div>";
  if (posts.length) html += "<h2>Сообщения</h2><div class='card' style='padding:2px 14px'>" + posts.slice(0, 200).map(function (p) {
    var t = D.topics[p.k];
    return '<div style="font-size:12.5px;padding-top:12px"><a href="#/topic/' + p.k + '">' + esc(t.title) + "</a></div>" + postHtml(p, t);
  }).join("") + "</div>";
  app.innerHTML = html;
}

/* ---------- search */
function viewSearch(q) {
  $("qtop").value = q;
  var html = '<div class="crumbs">wapForum</div><h1>Поиск</h1><div class="toolbar"><input type="search" id="sq" placeholder="Слово или фраза из сообщения, название темы, ник…" value="' + esc(q) + '" autofocus></div><div id="sres"></div>';
  app.innerHTML = html;
  var t; $("sq").oninput = function () { clearTimeout(t); var v = this.value; t = setTimeout(function () { history.replaceState(null, "", "#/search?q=" + encodeURIComponent(v)); fillSearch(v.trim()); }, 150); };
  fillSearch(q);
}
function fillSearch(q) {
  var el = $("sres");
  if (q.length < 2) { el.innerHTML = '<p class="faint">Введите хотя бы два символа. Поиск идёт по тексту всех восстановленных сообщений, названиям тем и никам.</p>'; return; }
  var ql = q.toLowerCase();
  var topics = D.topics.filter(function (t) { return t.title.toLowerCase().indexOf(ql) >= 0; }).slice(0, 20);
  var users = D.users.filter(function (u) { return u.nick.toLowerCase().indexOf(ql) >= 0; }).slice(0, 20);
  var posts = D.posts.filter(function (p) { return p.x.toLowerCase().indexOf(ql) >= 0; });
  var html = "";
  if (topics.length) html += "<h2>Темы</h2><div class='card' style='padding:4px'><ul class='rows'>" + topics.map(topicRow).join("") + "</ul></div>";
  if (users.length) html += "<h2>Участники</h2><p>" + users.map(function (u) { return '<a class="icon-btn" style="margin:0 6px 6px 0" href="#/user/' + encodeURIComponent(u.h) + "/" + u.id + '">' + esc(u.nick) + "</a>"; }).join("") + "</p>";
  html += "<h2>Сообщения <span class='faint' style='font-weight:400'>" + num(posts.length) + "</span></h2>";
  html += posts.length ? "<div class='card' style='padding:2px 14px'>" + posts.slice(0, 150).map(function (p) {
    var t = D.topics[p.k];
    return '<div style="font-size:12.5px;padding-top:12px"><a href="#/topic/' + p.k + '">' + esc(t.title) + "</a></div>" + postHtml(p, t, q);
  }).join("") + "</div>" + (posts.length > 150 ? '<p class="faint">Показаны первые 150 — уточните запрос.</p>' : "") : '<p class="faint">Ничего не найдено.</p>';
  el.innerHTML = html;
}

/* ---------- gallery */
function shotHtml(g) {
  return '<a class="shot" href="' + srcLink(g.id) + '"><div class="device"><div class="scr"><iframe loading="lazy" tabindex="-1" src="p/' + g.id + '.html" title="' + esc(g.label) + '"></iframe></div></div><div class="cap"><b>' + esc(g.label) + '</b><span class="faint">' + esc(hostName(g.host)) + " · " + tsLong(g.ts) + "</span></div></a>";
}
function viewGallery() {
  var html = '<div class="crumbs">wapForum</div><h1>Как это выглядело</h1><p class="lede">Настоящие сохранённые страницы, показанные на экране размером с телефон того времени. Нажмите на любую, чтобы открыть её целиком и походить по ссылкам.</p>';
  var by = {};
  D.gallery.forEach(function (g) { (by[g.label] = by[g.label] || []).push(g); });
  var keys = Object.keys(by);
  html += keys.length ? keys.map(function (k) { return "<h2>" + esc(k) + "</h2><div class='gal'>" + by[k].map(shotHtml).join("") + "</div>"; }).join("") : '<div class="note">Страницы ещё скачиваются.</div>';
  app.innerHTML = html;
}

$("foot").innerHTML = 'Реконструкция по снимкам <a href="https://web.archive.org/web/*/forum.wapcity.ru*" target="_blank" rel="noopener">Wayback Machine</a>. Тексты сообщений принадлежат их авторам; номера телефонов в сообщениях скрыты. · <a href="archive.html">Исходные страницы</a>';
route();
})();
</script>
