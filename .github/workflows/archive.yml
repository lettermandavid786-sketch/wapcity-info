# Crawls forum.wapcity.ru from the Wayback Machine, rebuilds the browsable
# site in docs/ and commits both back. The Wayback index is committed first so
# the size of the archive is known within minutes; pages are then downloaded
# in ~40-minute runs, each committing its progress and re-dispatching the
# workflow until every selected capture is on disk (resumes from the manifest).
name: Archive forum.wapcity.ru

on:
  workflow_dispatch:
    inputs:
      versions:
        description: "Versions per URL: 1 = latest, N = spread over time, 0 = all"
        default: "3"
      refresh_cdx:
        description: "Re-query the Wayback index"
        type: boolean
        default: false
  push:
    branches: [claude/wapcity-forum-archive-eh7ezm]
    paths:
      - "scripts/**"
      - ".github/workflows/archive.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: archive-${{ github.ref }}
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Wayback index
        run: |
          python3 scripts/fetch_wayback.py --cdx-only \
            --domain forum.wapcity.ru \
            --versions "${{ inputs.versions || '3' }}" --assets \
            ${{ inputs.refresh_cdx && '--refresh-cdx' || '' }}
          cat archive/sources.json

      - name: Commit index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          python3 scripts/build_site.py --archive archive --out docs
          python3 scripts/extract_forum.py --archive archive --out docs
          git add archive docs
          git diff --cached --quiet || { git commit -m "Wayback index for forum.wapcity.ru"; git pull --rebase -X theirs; git push; }

      - name: Fetch pages
        run: |
          python3 scripts/fetch_wayback.py \
            --domain forum.wapcity.ru \
            --versions "${{ inputs.versions || '3' }}" \
            --assets \
            --max-minutes 40

      - name: Build site
        run: |
          python3 scripts/build_site.py --archive archive --out docs
          python3 scripts/extract_forum.py --archive archive --out docs

      - name: Commit pages
        run: |
          git add archive docs
          if git diff --cached --quiet; then
            echo "nothing new"
          else
            n=$(python3 -c "import json;d=json.load(open('archive/sources.json'));print(d.get('downloaded',0),'/',d.get('selected',0))")
            git commit -m "Archive update: $n captures"
            git pull --rebase -X theirs
            git push
          fi

      - name: Continue if incomplete
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          complete=$(python3 -c "import json;print(json.load(open('archive/sources.json')).get('complete'))")
          if [ "$complete" != "True" ]; then
            gh workflow run archive.yml --ref "${GITHUB_REF_NAME}" -f versions="${{ inputs.versions || '3' }}"
          fi
